version: '3.6'

networks:
  gitlab-network:
    name: gitlab-network
    driver: bridge

services:
  # Docker daemon for GitLab Runner with insecure registry support
  gitlab-runner-docker:
    image: docker:dind
    container_name: gitlab-runner-docker
    privileged: true
    restart: always
    networks:
      - gitlab-network
    command:
      - "dockerd"
      - "--host=unix:///var/run/docker.sock"
      - "--host=tcp://0.0.0.0:2376"
      - "--tls=false"
      - "--insecure-registry=host.docker.internal:5001"
    volumes:
      - 'gitlab_runner_docker:/var/lib/docker'

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    networks:
      - gitlab-network
    environment:
      GITLAB_ROOT_PASSWORD: "5iveL!fe"
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab'
        nginx['listen_port'] = 80
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        registry_external_url 'http://gitlab:5001'
        registry['enable'] = true
        registry_nginx['listen_port'] = 5001
    ports:
      - '8080:80'
      - '8443:443'
      - '2222:22'
    volumes:
      - 'gitlab_config:/etc/gitlab'
      - 'gitlab_logs:/var/log/gitlab'
      - 'gitlab_data:/var/opt/gitlab'
    shm_size: '256m'

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    networks:
      - gitlab-network
    depends_on:
      - gitlab-runner-docker
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - 'gitlab_runner_config:/etc/gitlab-runner'
      - 'gitlab_runner_docker_sock:/var/run'
    volumes_from:
      - gitlab-runner-docker:rw

volumes:
  gitlab_config:
  gitlab_data:
  gitlab_logs:
  gitlab_runner_config:
  gitlab_runner_docker:
  gitlab_runner_docker_sock: