stages:
  - setup_gitlab
  - validate
  - deploy_infra
  - deploy_app
  - deploy_backend

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  BUCKET_BASE_NAME: "hello-nextjs"
  # LocalStack is already running on the host at localhost:4566
  # CI jobs access these via host network or gateway

# Automated GitLab project setup (runs setup-gitlab.sh)
setup_gitlab:
  stage: setup_gitlab
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - ./scripts/setup-gitlab.sh
  only:
    - main
  when: manual

# Build custom CI images with pre-installed tools
build_ci_images:
  stage: setup_gitlab
  image: docker:latest
  services:
    - name: docker:dind
      command: ["dockerd", "--host=tcp://0.0.0.0:2376", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_INSECURE_REGISTRIES: "host.docker.internal:5001"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD http://host.docker.internal:5001
    - docker build -f Dockerfile.ci-node -t host.docker.internal:5001/root/nextjs-on-localstack/ci-node:$CI_COMMIT_REF_SLUG .
    - docker build -f Dockerfile.ci-python -t host.docker.internal:5001/root/nextjs-on-localstack/ci-python:$CI_COMMIT_REF_SLUG .
    - docker push host.docker.internal:5001/root/nextjs-on-localstack/ci-node:$CI_COMMIT_REF_SLUG
    - docker push host.docker.internal:5001/root/nextjs-on-localstack/ci-python:$CI_COMMIT_REF_SLUG
  only:
    changes:
      - Dockerfile.ci-node
      - Dockerfile.ci-python
      - ".gitlab-ci.yml"
# CI checks (from ci.sh)
validate:
  stage: validate
  image: host.docker.internal:5001/root/nextjs-on-localstack/ci-node:$CI_COMMIT_REF_SLUG
  variables:
    # Access LocalStack on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    TF_VAR_localstack_endpoint: "http://host.docker.internal:4566"
    TF_VAR_bucket_base_name: "$BUCKET_BASE_NAME"
  script:
    - cd hello-nextjs
    - npm ci
    - npm run lint
    - npm run build
    - cd ../infrastructure
    - terraform init
    - terraform validate
  only:
    - merge_requests
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy infrastructure (adapted from deploy-infra.sh)
# Uses existing LocalStack at host gateway (accessible from CI containers)
deploy_infra:
  stage: deploy_infra
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  variables:
    # Access LocalStack on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    TF_VAR_localstack_endpoint: "http://host.docker.internal:4566"
    TF_VAR_bucket_base_name: "$BUCKET_BASE_NAME"
  before_script:
    - apk add --no-cache aws-cli
  script:
    - set -x
    - cd infrastructure
    - terraform init
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        ENV="prod"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        ENV="staging"
      else
        ENV="$CI_COMMIT_REF_NAME"
      fi
      SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_')
      export TF_VAR_environment="$SANITIZED_ENV"
      terraform workspace select "$SANITIZED_ENV" || terraform workspace new "$SANITIZED_ENV"
    - terraform refresh
    - terraform apply -auto-approve
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy app (adapted from deploy-app.sh)
deploy_app:
  stage: deploy_app
  image: host.docker.internal:5001/root/nextjs-on-localstack/ci-python:$CI_COMMIT_REF_SLUG
  variables:
    # Access LocalStack S3 on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
  dependencies:
    - deploy_infra
  script:
    - pip install boto3 botocore
    - cd infrastructure
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        ENV="prod"
        API_PORT=3001
        API_SUBDOMAIN="api"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        ENV="staging"
        API_PORT=3002
        API_SUBDOMAIN="api-staging"
      else
        ENV="$CI_COMMIT_REF_NAME"
        ENV_HASH=$(echo "$ENV" | md5sum | cut -c1-4 | tr 'a-f' '0-9' | cut -c1-4)
        API_PORT=$((3003 + (16#${ENV_HASH:0:3} % 100)))
        SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
        API_SUBDOMAIN="api-$SANITIZED_ENV"
      fi
      SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_')
      terraform workspace select "$SANITIZED_ENV"
      BUCKET_NAME=$(terraform output -raw s3_bucket_name)
    - cd ../hello-nextjs
    - npm ci --only=production
    - API_ENDPOINT="http://$API_SUBDOMAIN.localhost.localstack.cloud:$API_PORT/api/status"
    - NEXT_PUBLIC_API_ENDPOINT="$API_ENDPOINT" npm run build
    - cd ..
    - python3 deploy-nextjs.py "$BUCKET_NAME"
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy backend (adapted from deploy-backend.sh)
# Uses existing Docker registry at host.docker.internal:5001
deploy_backend:
  stage: deploy_backend
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # Access Docker registry on host via Docker gateway
    DOCKER_REGISTRY_ENDPOINT: "host.docker.internal:5001"
    # Access LocalStack on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
  dependencies:
    - deploy_infra
  before_script:
    - apk add --no-cache wget unzip aws-cli
    - wget -O /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
    - unzip /tmp/terraform.zip -d /usr/local/bin/
    - chmod +x /usr/local/bin/terraform
  script:
    - cd backend-api
    - docker build -t backend-api:latest .
    - docker tag backend-api:latest "$DOCKER_REGISTRY_ENDPOINT/backend-api:latest"
    - docker push "$DOCKER_REGISTRY_ENDPOINT/backend-api:latest"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        ENV="prod"
        API_PORT=3001
        API_SUBDOMAIN="api"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        ENV="staging"
        API_PORT=3002
        API_SUBDOMAIN="api-staging"
      else
        ENV="$CI_COMMIT_REF_NAME"
        ENV_HASH=$(echo "$ENV" | md5sum | cut -c1-4 | tr 'a-f' '0-9' | cut -c1-4)
        API_PORT=$((3003 + (16#${ENV_HASH:0:3} % 100)))
        SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
        API_SUBDOMAIN="api-$SANITIZED_ENV"
      fi
      SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_')
      cd ../infrastructure
      terraform workspace select "$SANITIZED_ENV"
      INSTANCE_ID=$(terraform output -raw ec2_instance_id)
      CONTAINER_NAME="backend-api-$SANITIZED_ENV"
      docker stop "$CONTAINER_NAME" || true
      docker rm "$CONTAINER_NAME" || true
      docker run -d --name "$CONTAINER_NAME" --restart unless-stopped -p "$API_PORT:3001" -e NODE_ENV=production -e EC2_INSTANCE_ID="$INSTANCE_ID" -e ENVIRONMENT="$ENV" "$DOCKER_REGISTRY_ENDPOINT/backend-api:latest"
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Manual deploy for production (if needed)
deploy_production_manual:
  stage: deploy_infra
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  variables:
    # Access LocalStack on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    TF_VAR_localstack_endpoint: "http://host.docker.internal:4566"
    TF_VAR_bucket_base_name: "$BUCKET_BASE_NAME"
    TF_VAR_environment: "prod"
  before_script:
    - apk add --no-cache aws-cli
  when: manual
  script:
    - set -x
    - cd infrastructure
    - terraform init
    - SANITIZED_ENV="prod"
    - terraform workspace select "$SANITIZED_ENV" || terraform workspace new "$SANITIZED_ENV"
    - terraform refresh
    - terraform apply -auto-approve
  environment:
    name: production
  only:
    - production
