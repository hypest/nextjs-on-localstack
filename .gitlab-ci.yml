stages:
  - setup_gitlab
  - validate
  - setup_env
  - deploy_infra
  - deploy_app
  - deploy_backend

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  BUCKET_BASE_NAME: "hello-nextjs"

# Automated GitLab project setup (runs setup-gitlab.sh)
setup_gitlab:
  stage: setup_gitlab
  image: docker:latest
  services:
    - docker:dind
  script:
    - ./scripts/setup-gitlab.sh
  only:
    - main
  when: manual # Run manually to avoid running on every push

# CI checks (from ci.sh)
validate:
  stage: validate
  image: node:18
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - wget -O /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_arm64.zip
    - unzip /tmp/terraform.zip -d /usr/local/bin/
    - chmod +x /usr/local/bin/terraform
  script:
    - cd hello-nextjs
    - npm ci
    - npm run lint
    - npm run build
    - cd ../infrastructure
    - terraform init
    - terraform validate
  only:
    - merge_requests
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Start LocalStack and supporting services
setup_env:
  stage: setup_env
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - apk add --no-cache bash
    - docker network create devcontainer-network || true
    - bash ./scripts/start-supporting-services.sh
    - bash ./scripts/start-localstack.sh
    - echo "LOCALSTACK_READY=true" > env-vars.env
  artifacts:
    reports:
      dotenv: env-vars.env
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy infrastructure (adapted from deploy-infra.sh)
deploy_infra:
  stage: deploy_infra
  image: hashicorp/terraform:latest
  dependencies:
    - setup_env
  script:
    - cd infrastructure
    - terraform init
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        ENV="prod"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        ENV="staging"
      else
        ENV="$CI_COMMIT_REF_NAME"
      fi
      SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_')
      terraform workspace select "$SANITIZED_ENV" || terraform workspace new "$SANITIZED_ENV"
    - terraform refresh -var="environment=$SANITIZED_ENV" -var="bucket_base_name=$BUCKET_BASE_NAME"
    - terraform apply -auto-approve -var="environment=$SANITIZED_ENV" -var="bucket_base_name=$BUCKET_BASE_NAME"
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy app (adapted from deploy-app.sh)
deploy_app:
  stage: deploy_app
  image: python:3.11
  dependencies:
    - deploy_infra
  script:
    - pip install boto3 botocore
    - cd infrastructure
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        ENV="prod"
        API_PORT=3001
        API_SUBDOMAIN="api"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        ENV="staging"
        API_PORT=3002
        API_SUBDOMAIN="api-staging"
      else
        ENV="$CI_COMMIT_REF_NAME"
        ENV_HASH=$(echo "$ENV" | md5sum | cut -c1-4 | tr 'a-f' '0-9' | cut -c1-4)
        API_PORT=$((3003 + (16#${ENV_HASH:0:3} % 100)))
        SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
        API_SUBDOMAIN="api-$SANITIZED_ENV"
      fi
      SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_')
      terraform workspace select "$SANITIZED_ENV"
      BUCKET_NAME=$(terraform output -raw s3_bucket_name)
    - cd ../hello-nextjs
    - npm ci --only=production
    - API_ENDPOINT="http://$API_SUBDOMAIN.localhost.localstack.cloud:$API_PORT/api/status"
    - NEXT_PUBLIC_API_ENDPOINT="$API_ENDPOINT" npm run build
    - cd ..
    - python3 deploy-nextjs.py "$BUCKET_NAME"
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy backend (adapted from deploy-backend.sh)
deploy_backend:
  stage: deploy_backend
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - deploy_infra
  script:
    - cd backend-api
    - docker build -t backend-api:latest .
    - docker tag backend-api:latest localhost:5001/backend-api:latest
    - docker push localhost:5001/backend-api:latest
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        ENV="prod"
        API_PORT=3001
        API_SUBDOMAIN="api"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        ENV="staging"
        API_PORT=3002
        API_SUBDOMAIN="api-staging"
      else
        ENV="$CI_COMMIT_REF_NAME"
        ENV_HASH=$(echo "$ENV" | md5sum | cut -c1-4 | tr 'a-f' '0-9' | cut -c1-4)
        API_PORT=$((3003 + (16#${ENV_HASH:0:3} % 100)))
        SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
        API_SUBDOMAIN="api-$SANITIZED_ENV"
      fi
      SANITIZED_ENV=$(echo "$ENV" | tr '/' '-' | tr ' ' '_')
      cd ../infrastructure
      terraform workspace select "$SANITIZED_ENV"
      INSTANCE_ID=$(terraform output -raw ec2_instance_id)
      CONTAINER_NAME="backend-api-$SANITIZED_ENV"
      docker stop "$CONTAINER_NAME" || true
      docker rm "$CONTAINER_NAME" || true
      docker run -d --name "$CONTAINER_NAME" --restart unless-stopped -p "$API_PORT:3001" -e NODE_ENV=production -e EC2_INSTANCE_ID="$INSTANCE_ID" -e ENVIRONMENT="$ENV" localhost:5001/backend-api:latest
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Manual deploy for production (if needed)
deploy_production_manual:
  stage: deploy_infra
  image: hashicorp/terraform:latest
  dependencies:
    - setup_env
  when: manual
  script:
    - cd infrastructure
    - terraform init
    - SANITIZED_ENV="prod"
    - terraform workspace select "$SANITIZED_ENV" || terraform workspace new "$SANITIZED_ENV"
    - terraform refresh -var="environment=$SANITIZED_ENV" -var="bucket_base_name=$BUCKET_BASE_NAME"
    - terraform apply -auto-approve -var="environment=$SANITIZED_ENV" -var="bucket_base_name=$BUCKET_BASE_NAME"
  environment:
    name: production
  only:
    - production
