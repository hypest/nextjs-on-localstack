stages:
  - build_ci_images
  - validate
  - deploy_infra
  - deploy_app
  - deploy_backend

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  BUCKET_BASE_NAME: "hello-nextjs"
  # LocalStack is already running on the host at localhost:4566
  # CI jobs access these via host network or gateway

# Build custom CI images with pre-installed tools
build_ci_node_image:
  stage: build_ci_images
  image: docker:latest
  services:
    - name: docker:dind
      command:
        [
          "dockerd",
          "--host=tcp://0.0.0.0:2375",
          "--tls=false",
          "--insecure-registry=host.docker.internal:5001",
        ]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache bash curl jq
    # Wait for Docker daemon to be ready
    - |
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is ready"
          break
        fi
        echo "Waiting for Docker daemon... ($i/30)"
        sleep 2
      done
  script:
    - |
      # Check if image exists in registry
      if curl -sf http://host.docker.internal:5001/v2/root/nextjs-on-localstack/ci-node/tags/list | jq -e ".tags[]? | select(. == \"$CI_COMMIT_REF_SLUG\")" > /dev/null 2>&1; then
        echo "Image already exists, skipping build"
        exit 0
      fi
      ./scripts/build-ci-node-image.sh
  rules:
    - changes: [scripts/build-ci-node-image.sh, Dockerfile.ci-node]
      when: always
    - when: on_success

build_ci_python_image:
  stage: build_ci_images
  image: docker:latest
  services:
    - name: docker:dind
      command:
        [
          "dockerd",
          "--host=tcp://0.0.0.0:2375",
          "--tls=false",
          "--insecure-registry=host.docker.internal:5001",
        ]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache bash curl jq
    # Wait for Docker daemon to be ready
    - |
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is ready"
          break
        fi
        echo "Waiting for Docker daemon... ($i/30)"
        sleep 2
      done
  script:
    - |
      # Check if image exists in registry
      if curl -sf http://host.docker.internal:5001/v2/root/nextjs-on-localstack/ci-python/tags/list | jq -e ".tags[]? | select(. == \"$CI_COMMIT_REF_SLUG\")" > /dev/null 2>&1; then
        echo "Image already exists, skipping build"
        exit 0
      fi
      ./scripts/build-ci-python-image.sh
  rules:
    - changes: [scripts/build-ci-python-image.sh, Dockerfile.ci-python]
      when: always
    - when: on_success
# CI checks (from ci.sh)
validate:
  stage: validate
  image: host.docker.internal:5001/root/nextjs-on-localstack/ci-node:$CI_COMMIT_REF_SLUG
  variables:
    # Access LocalStack on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    TF_VAR_localstack_endpoint: "http://host.docker.internal:4566"
    TF_VAR_bucket_base_name: "$BUCKET_BASE_NAME"
  script:
    - cd hello-nextjs
    - npm ci
    - npm run lint
    - npm run build
    - cd ../infrastructure
    - terraform init
    - terraform validate
  only:
    - merge_requests
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy infrastructure (adapted from deploy-infra.sh)
# Uses existing LocalStack at host gateway (accessible from CI containers)
deploy_infra:
  stage: deploy_infra
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  variables:
    # Access LocalStack on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    TF_VAR_localstack_endpoint: "http://host.docker.internal:4566"
    TF_VAR_bucket_base_name: "$BUCKET_BASE_NAME"
  before_script:
    - apk add --no-cache aws-cli bash
  script:
    - |
      set -x

      DEPLOY_ENV=$(./scripts/get-environment-from-branch.sh)
      export DEPLOY_ENV
      ./scripts/deploy-infra.sh
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy app (adapted from deploy-app.sh)
deploy_app:
  stage: deploy_app
  image: host.docker.internal:5001/root/nextjs-on-localstack/ci-python:$CI_COMMIT_REF_SLUG
  variables:
    # Access LocalStack S3 on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
  dependencies:
    - deploy_infra
  script:
    - |
      DEPLOY_ENV=$(./scripts/get-environment-from-branch.sh)
      export DEPLOY_ENV
      cd infrastructure && terraform init && cd ..
      ./scripts/deploy-app.sh
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Deploy backend (adapted from deploy-backend.sh)
# Uses existing Docker registry at host.docker.internal:5001
deploy_backend:
  stage: deploy_backend
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # Access Docker registry on host via Docker gateway
    DOCKER_REGISTRY_ENDPOINT: "host.docker.internal:5001"
    # Access LocalStack on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
  dependencies:
    - deploy_infra
  before_script:
    - apk add --no-cache wget unzip aws-cli bash
    - wget -O /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
    - unzip /tmp/terraform.zip -d /usr/local/bin/
    - chmod +x /usr/local/bin/terraform
  script:
    - ./scripts/build-backend-api.sh
    - |
      DEPLOY_ENV=$(./scripts/get-environment-from-branch.sh)
      export DEPLOY_ENV
      cd infrastructure && terraform init && cd ..
      ./scripts/deploy-backend.sh
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - main
    - develop
    - /^feature\/.*/
    - base/cicd-deploy

# Manual deploy for production (if needed)
deploy_production_manual:
  stage: deploy_infra
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  variables:
    # Access LocalStack on host via Docker gateway
    AWS_ENDPOINT_URL: "http://host.docker.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    TF_VAR_localstack_endpoint: "http://host.docker.internal:4566"
    TF_VAR_bucket_base_name: "$BUCKET_BASE_NAME"
    TF_VAR_environment: "prod"
  before_script:
    - apk add --no-cache aws-cli
  when: manual
  script:
    - set -x
    - cd infrastructure
    - terraform init
    - SANITIZED_ENV="prod"
    - terraform workspace select "$SANITIZED_ENV" || terraform workspace new "$SANITIZED_ENV"
    - terraform refresh
    - terraform apply -auto-approve
  environment:
    name: production
  only:
    - production
